<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" width="100%" height="100%">
  <!--
    SOLO check-in button — turquoise
    • Idle eye wander + blinks run automatically and loop forever (no code needed).
    • To trigger happy eyes on successful check-in, add class "is-happy" to this SVG.
      Pupils snap to center in 0.15s, then happy eyes appear and stay.
      Screen auto-dismisses after 5s, so no need to revert to idle.
    • Shadow uses mix-blend-mode: multiply — SVG should be inlined in the DOM,
      not used via <img>. If inlining isn't possible, remove the
      "#Shadow { mix-blend-mode: multiply; }" rule for a flat 25% shadow fallback.
  -->
  <defs>
    <clipPath id="eyeLeftClip"><circle cx="767.44" cy="853.15" r="188.61"/></clipPath>
    <clipPath id="eyeRightClip"><circle cx="1280.09" cy="853.15" r="188.61"/></clipPath>

    <clipPath id="blinkClip">
      <rect x="578.83" y="664.54" width="889.87" height="377.22">
        <animate attributeName="y"
          values="664.54; 664.54; 853.15; 664.54; 664.54; 853.15; 664.54; 664.54; 853.15; 664.54; 664.54; 853.15; 664.54; 664.54"
          keyTimes="0; 0.231; 0.24; 0.249; 0.471; 0.48; 0.489; 0.711; 0.72; 0.729; 0.951; 0.96; 0.969; 1"
          dur="14s" repeatCount="indefinite"/>
        <animate attributeName="height"
          values="377.22; 377.22; 0; 377.22; 377.22; 0; 377.22; 377.22; 0; 377.22; 377.22; 0; 377.22; 377.22"
          keyTimes="0; 0.231; 0.24; 0.249; 0.471; 0.48; 0.489; 0.711; 0.72; 0.729; 0.951; 0.96; 0.969; 1"
          dur="14s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    #Shadow { mix-blend-mode: multiply; }
    #Lids-happy { opacity: 0; }

    .is-happy #pupil-left,
    .is-happy #pupil-right {
      transform: translate(0px, 0px);
      transition: transform 0.15s ease-out;
    }
    .is-happy #Eyes       { animation: none; opacity: 0; transition: opacity 0s 0.15s; }
    .is-happy #Lids-happy { animation: none; opacity: 1; transition: opacity 0s 0.15s; }
  </style>

  <g id="Shadow">
    <circle cx="1082.85" cy="1082.87" r="890.78" fill="#002c3e" opacity=".25"/>
  </g>
  <g id="Button">
    <circle cx="1023.98" cy="1024" r="890.78" fill="#0aa298"/>
