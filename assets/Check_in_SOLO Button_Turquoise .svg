        <animateTransform attributeName="transform" type="translate"
          values="0,0; -139,0; 0,0; 139,0; 0,0; 0,-139; 0,0; 0,139; 0,0; -98,-98; 0,0; 98,-98; 0,0; -98,98; 0,0; 98,98; 0,0; 0,0"
          keyTimes="0; 0.06; 0.12; 0.18; 0.24; 0.30; 0.36; 0.42; 0.48; 0.54; 0.60; 0.66; 0.72; 0.78; 0.84; 0.90; 0.96; 1"
