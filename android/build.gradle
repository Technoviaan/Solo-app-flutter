buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
    
    def applyFixes = { subproject ->
        if (subproject.hasProperty('android')) {
            if (subproject.android.namespace == null) {
                subproject.android.namespace = "com.flutter.plugins.${subproject.name.replaceAll('[^a-zA-Z0-9_]', '.')}"
            }
            subproject.tasks.whenTaskAdded { task ->
                if (task.name == "processDebugManifest" || task.name == "processReleaseManifest") {
                    task.doFirst {
                        def manifestFile = subproject.file("src/main/AndroidManifest.xml")
                        if (manifestFile.exists()) {
                            def content = manifestFile.text
                            if (content.contains('package=')) {
                                subproject.logger.info("Fixing manifest for ${subproject.name}")
                                manifestFile.text = content.replaceAll(/package="[^"]*"/, "")
                            }
                        }
                    }
                }
            }
        }
    }
    //     }
    // }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
